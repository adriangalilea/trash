<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- the back of Apple's bin, seen a little from above: the rim's far half
       (a stadium, 282..742 across, 286..392 down, its ends round) and the
       opening inside it (304..720, 300..378), darker as it goes down. The
       rim's near half and the body are front.svg, on the same numbers. -->
  <defs>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e6269"/>
      <stop offset="1" stop-color="#9ea2a8"/>
    </linearGradient>
  </defs>
  <rect x="282" y="286" width="460" height="106" rx="53" fill="#eceef1"/>
  <rect x="304" y="300" width="416" height="78" rx="39" fill="url(#inside)"/>
</svg>
