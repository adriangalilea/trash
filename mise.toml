# trash: macOS Trash CLI. The verbs (`mise <task>` from the repo root):
#   build      the binary (release)
#   install    build + install to ~/.local/bin/trash (shadows /usr/bin/trash on purpose)
#   uninstall  remove the installed binary (PATH falls back to /usr/bin/trash)
#   check      compile, debug: the fast typecheck
#   format     swift-format in place (the Xcode toolchain's)
#   icon       trash.icon (Icon Composer, SVG layers) → Resources/icon.png, the site's icon (swift-utils' mark)
#   clean      remove the build directory

[env]
# SwiftPM has no version field; the tag IS the version: BARE semver
# (garden notes convention). v-prefixed twins exist for 1.0.0/1.1.0 only
# because the first brew formula URL pinned v1.1.0; bare-only from here.
VERSION = "1.2.0"

[tasks.build]
description = "Build the trash binary (release)"
run = "swift build -c release"

[tasks.install]
description = "Install to ~/.local/bin/trash"
depends = ["build"]
run = "install -d $HOME/.local/bin && install -m 755 .build/release/trash $HOME/.local/bin/trash"

[tasks.uninstall]
description = "Remove ~/.local/bin/trash"
run = "rm -f $HOME/.local/bin/trash"

[tasks.check]
description = "Compile everything, debug"
run = "swift build"

[tasks.format]
description = "swift-format in place"
run = "xcrun swift-format --recursive Sources/ --in-place"

# One drawing, every icon file: trash.icon (Icon Composer's package, its
# layers SVG) is the icon; swift-utils' `mark` renders the site's icon.png
# from it, build output never committed. `mark preview trash.icon` is the
# review. Skipped while the package is unchanged.
[tasks.icon]
description = "Compile trash.icon: Resources/icon.png (swift-utils' mark)"
tools = { "spm:adriangalilea/swift-utils" = { version = "0.20.0", filter_bins = "mark,ship" } }
sources = ["trash.icon/icon.json", "trash.icon/Assets/*.svg"]
outputs = ["Resources/icon.png"]
run = "mark build trash.icon --out Resources --png Resources/icon.png"

[tasks.clean]
description = "Remove the build directory"
run = "rm -rf .build"
